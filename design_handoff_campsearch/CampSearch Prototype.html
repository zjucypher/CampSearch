<body>
  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens-landing.jsx"></script>
  <script type="text/babel" src="screens-search.jsx"></script>
  <script type="text/babel" src="screens-dashboard.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <div id="root" data-screen-label="CampSearch · three directions"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const ABW = 1440;
    const ABH = 920;

    function Canvas() {
      return (
        <DesignCanvas>
          <DCSection
            id="campsearch"
            title="CampSearch · Field Notes"
            subtitle="Parchment + moss, mono labels + serif body, minimal researcher aesthetic. Use the screen jumper (bottom-left) to walk the flow. Landing on Dashboard fires the 'site found' toast.">
            <DCArtboard id="field" label="Field Notes · full prototype" width={ABW} height={ABH}>
              <Prototype theme="field" initialScreen="landing"/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Canvas/>);
  </script>
